<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Hunter — Map Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: rgba(255,255,255,0.08);
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --green: #34d399;
      --orange: #fb923c;
      --red: #f87171;
      --purple: #c084fc;
      --purple-border: #a855f7;
      --cyan: #22d3ee;
      --cyan-border: #0891b2;
      --text: #e2e8f0;
      --text-muted: #6b7280;
      --text-dim: #94a3b8;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    #map { position: fixed; inset: 0; z-index: 0; }

    /* ── Panel ── */
    #panel {
      position: fixed; top: 16px; left: 16px; z-index: 1000;
      width: 300px; max-height: calc(100vh - 32px);
      background: rgba(26, 29, 39, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    #panel-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #panel-header h1 {
      font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    #panel-header p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    #panel-body { overflow-y: auto; padding: 14px 18px; flex: 1; }
    #panel-body::-webkit-scrollbar { width: 4px; }
    #panel-body::-webkit-scrollbar-track { background: transparent; }
    #panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section-title {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 8px; margin-top: 14px;
    }
    .section-title:first-child { margin-top: 0; }

    /* Stats row */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--surface2); border-radius: 8px;
      padding: 10px 12px; border: 1px solid var(--border);
    }
    .stat-card .val { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-card .lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
    .stat-card.green .val { color: var(--green); }
    .stat-card.orange .val { color: var(--orange); }

    /* Filter tags */
    .filter-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .filter-row:last-child { border-bottom: none; }
    .filter-label { color: var(--text-muted); min-width: 80px; flex-shrink: 0; padding-top: 1px; }
    .filter-val { color: var(--text); font-weight: 500; }
    .tag {
      display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px;
      background: rgba(79, 142, 247, 0.15); color: var(--accent);
      border: 1px solid rgba(79, 142, 247, 0.3); margin: 1px;
    }

    /* Legend */
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot.sent { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.unsent { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
    .dot.center { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.school { background: var(--purple); box-shadow: 0 0 6px var(--purple); }
    .dot.ninkagai { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

    /* Layer toggle buttons */
    .layer-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .layer-btn {
      padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-dim); font-size: 11px;
      cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap;
    }
    .layer-btn.on-houses { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.1); }
    .layer-btn.on-ninka  { border-color: var(--purple); color: var(--purple); background: rgba(192,132,252,0.1); }
    .layer-btn.on-ninkagai { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.1); }

    /* Loading overlay */
    #loading {
      position: fixed; inset: 0; z-index: 2000;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #loading .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--text-muted); }

    /* Error banner */
    #error-banner {
      display: none;
      position: fixed; top: 16px; right: 16px; z-index: 2000;
      background: rgba(248, 113, 113, 0.15); border: 1px solid var(--red);
      border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--red);
      max-width: 320px;
    }

    /* Refresh button */
    #btn-refresh {
      margin-top: 14px; width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px; padding: 9px;
      color: white; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; letter-spacing: 0.3px;
    }
    #btn-refresh:hover { opacity: 0.85; }
    #btn-refresh:active { opacity: 0.7; }

    /* ── Marker Cluster (dark theme) ── */
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background: rgba(79, 142, 247, 0.75) !important;
      color: #fff !important;
      font-weight: 700 !important;
      font-size: 12px !important;
      font-family: 'Inter', sans-serif !important;
    }
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background: rgba(79, 142, 247, 0.25) !important;
    }
    /* Spider legs */
    .leaflet-cluster-anim .leaflet-marker-icon,
    .leaflet-cluster-anim .leaflet-marker-shadow {
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    /* Toggle buttons */
    .toggle-group { display: flex; gap: 6px; margin-top: 8px; }
    .toggle-btn {
      flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-dim); font-size: 11px;
      cursor: pointer; transition: all 0.15s; text-align: center; font-family: inherit;
    }
    .toggle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.1); }

    /* ── Leaflet popup override ── */
    .leaflet-popup-content-wrapper {
      background: rgba(22, 26, 40, 0.97) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 10px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
      color: var(--text) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip { background: rgba(22, 26, 40, 0.97) !important; }
    .leaflet-popup-content { margin: 0 !important; min-width: 240px; max-width: 300px; }
    .leaflet-popup-close-button { color: var(--text-muted) !important; font-size: 18px !important; top: 8px !important; right: 10px !important; }

    .popup-inner { padding: 14px 16px; }
    .popup-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.3; padding-right: 16px; }
    .popup-price { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    .popup-price span { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    .popup-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; }
    .popup-grid .k { color: var(--text-muted); }
    .popup-grid .v { color: var(--text); font-weight: 500; }
    .popup-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .popup-transport { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .popup-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .popup-btn {
      flex: 1; padding: 7px 10px; border-radius: 6px; text-align: center;
      font-size: 11px; font-weight: 600; text-decoration: none; cursor: pointer;
      transition: opacity 0.15s; display: block;
    }
    .popup-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }
    .popup-btn.primary:hover { opacity: 0.85; }
    .popup-badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px;
      font-weight: 600; margin-left: 6px;
    }
    .popup-badge.sent { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
    .popup-badge.unsent { background: rgba(251,146,60,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.3); }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>データを読み込み中...</p>
</div>

<div id="error-banner"></div>
<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <h1>🏠 Home Hunter Map</h1>
    <p id="panel-subtitle">読み込み中...</p>
  </div>
  <div id="panel-body">
    <div class="section-title">結果</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="val" id="stat-matched">—</div><div class="lbl">条件一致</div></div>
      <div class="stat-card"><div class="val" id="stat-total">—</div><div class="lbl">DB合計</div></div>
      <div class="stat-card green"><div class="val" id="stat-sent">—</div><div class="lbl">通知済み</div></div>
      <div class="stat-card orange"><div class="val" id="stat-unsent">—</div><div class="lbl">未通知</div></div>
    </div>

    <div class="section-title" style="margin-top:14px;">保育所 (1歳児空き)</div>
    <div class="stats-grid">
      <div class="stat-card" style="border-color:rgba(192,132,252,0.3);">
        <div class="val" id="stat-schools" style="color:var(--purple);">—</div>
        <div class="lbl">空きあり</div>
      </div>
      <div class="stat-card" style="border-color:rgba(192,132,252,0.15);">
        <div class="val" id="stat-schools-total" style="color:var(--purple);">—</div>
        <div class="lbl">合計</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:14px;">認可外保育所</div>
    <div class="stats-grid">
      <div class="stat-card" style="border-color:rgba(34,211,238,0.3);">
        <div class="val" id="stat-ninkagai" style="color:var(--cyan);">—</div>
        <div class="lbl">表示数</div>
      </div>
      <div class="stat-card" style="border-color:rgba(34,211,238,0.15);">
        <div class="val" id="stat-ninkagai-total" style="color:var(--cyan);">—</div>
        <div class="lbl">合計</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:14px;">レイヤー表示</div>
    <div class="layer-group">
      <button class="layer-btn on-houses" id="layer-houses" onclick="toggleLayer('houses')">🏠 物件</button>
      <button class="layer-btn on-ninka"  id="layer-ninka"  onclick="toggleLayer('ninka')">🏫 認可</button>
      <button class="layer-btn on-ninkagai" id="layer-ninkagai" onclick="toggleLayer('ninkagai')">🏢 認可外</button>
    </div>

    <div class="section-title" style="margin-top:14px;">物件フィルター</div>
    <div class="toggle-group">
      <button class="toggle-btn active" id="tog-all" onclick="setFilter('all')">全て</button>
      <button class="toggle-btn" id="tog-sent" onclick="setFilter('sent')">通知済み</button>
      <button class="toggle-btn" id="tog-unsent" onclick="setFilter('unsent')">未通知</button>
    </div>

    <div class="section-title">凡例</div>
    <div class="legend-row"><div class="dot sent"></div><span>通知済み物件 (Telegram送信済)</span></div>
    <div class="legend-row"><div class="dot unsent"></div><span>未通知物件 (条件一致・未送信)</span></div>
    <div class="legend-row"><div class="dot center"></div><span>中心点</span></div>
    <div class="legend-row"><div class="dot school"></div><span>認可保育所 (1歳児空きあり)</span></div>
    <div class="legend-row"><div class="dot ninkagai"></div><span>認可外保育所</span></div>

    <div class="section-title">適用フィルター</div>
    <div id="filter-list"></div>

    <button id="btn-refresh" onclick="loadData()">🔄 データ更新</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ── Map init ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: false,
  attributionControl: true,
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Dark tile: CartoDB Dark Matter (free, no API key)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────
let allListings = [];
let allMarkers = [];
let allSchools = [];
let schoolMarkers = [];
let allNinkagai = [];
let ninkagaiMarkers = [];
let filterMode = 'all';
let circleLayer = null;
let centerMarker = null;

// Layer visibility state
const layerVisible = { houses: true, ninka: true, ninkagai: true };

// MarkerClusterGroup for house listings (enables spiderfying of overlapping markers)
let markerClusterGroup = null;

// ── Marker helpers ────────────────────────────────────────────────────────
// Creates a DivIcon that looks like a circle — required for MarkerClusterGroup
function makeHouseIcon(listing) {
  const fill  = listing.tele_sent ? '#34d399' : '#fb923c';
  const border = listing.tele_sent ? '#059669' : '#c2410c';
  const glow  = listing.tele_sent ? 'rgba(52,211,153,0.5)' : 'rgba(251,146,60,0.5)';
  return L.divIcon({
    className: '',
    html: `<div style="
      width:16px;height:16px;border-radius:50%;
      background:${fill};border:2px solid ${border};
      box-shadow:0 0 6px ${glow};
      "></div>`,
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -10],
  });
}

function fmt(val, suffix, decimals=1) {
  if (val === null || val === undefined) return '—';
  return Number(val).toFixed(decimals) + suffix;
}

function fmtYen(val) {
  if (val === null || val === undefined) return '—';
  if (val >= 1) return val + '万円';
  return Math.round(val * 10000).toLocaleString() + '円';
}

function fmtAge(age, raw) {
  if (age === null || age === undefined) return raw || '—';
  if (age === 0) return '新築';
  return '築' + age + '年';
}

function buildPopup(l) {
  const badge = l.tele_sent
    ? '<span class="popup-badge sent">通知済み</span>'
    : '<span class="popup-badge unsent">未通知</span>';

  const adminFee = l.admin_fee_yen
    ? `+管理費 ${Math.round(l.admin_fee_yen).toLocaleString()}円` : '';

  const deposit = l.deposit_man_yen !== null && l.deposit_man_yen !== undefined
    ? fmtYen(l.deposit_man_yen) : '—';
  const keyMoney = l.key_money_man_yen !== null && l.key_money_man_yen !== undefined
    ? fmtYen(l.key_money_man_yen) : '—';

  const transport = l.transportation
    ? `<hr class="popup-divider"><div class="popup-transport">${l.transportation.replace(/\|/g,'<br>')}</div>`
    : '';

  return `
    <div class="popup-inner">
      <div class="popup-name">${l.name || '物件名不明'}${badge}</div>
      <div class="popup-price">${l.price_man_yen ? l.price_man_yen + '万円' : '—'}<span> /月 ${adminFee}</span></div>
      <div class="popup-grid">
        <span class="k">間取り</span><span class="v">${l.layout || '—'}</span>
        <span class="k">面積</span><span class="v">${fmt(l.size_m2,'㎡')}</span>
        <span class="k">階数</span><span class="v">${l.floor || '—'}</span>
        <span class="k">築年数</span><span class="v">${fmtAge(l.building_age, l.building_age_raw)}</span>
        <span class="k">敷金</span><span class="v">${deposit}</span>
        <span class="k">礼金</span><span class="v">${keyMoney}</span>
        <span class="k">距離</span><span class="v">${l.distance_km !== null ? l.distance_km.toFixed(2)+'km' : '—'}</span>
        <span class="k">住所</span><span class="v" style="font-size:10px;line-height:1.4">${l.address || '—'}</span>
      </div>
      ${transport}
    </div>
    <div class="popup-footer">
      <a class="popup-btn primary" href="${l.url}" target="_blank" rel="noopener">詳細を見る →</a>
    </div>`;
}

// ── School marker helpers ────────────────────────────────────────────────
function schoolMarkerStyle(vacancies) {
  // Larger = more vacancies
  const r = Math.min(6 + vacancies * 2, 16);
  return {
    radius: r,
    fillColor: '#c084fc',
    color: '#7e22ce',
    weight: 2.5,
    opacity: 1,
    fillOpacity: 0.88,
  };
}

function buildSchoolPopup(s) {
  const notesHtml = s.notes
    ? `<div class="popup-transport" style="margin-top:8px;">${s.notes}</div>` : '';
  const dateStr = s.scraped_at ? s.scraped_at.substring(0, 10) : '';
  return `
    <div class="popup-inner">
      <div class="popup-name" style="color:#c084fc;">🏫 ${s.name}</div>
      <div class="popup-price" style="color:#c084fc;font-size:18px;">
        空き <span style="font-size:28px;font-weight:800;">${s.vacancies}</span> 名
        <span style="font-size:12px;color:var(--text-muted);"> (1歳児)</span>
      </div>
      <div class="popup-grid">
        <span class="k">住所</span><span class="v" style="font-size:10px;line-height:1.4">${s.address || '—'}</span>
        ${dateStr ? `<span class="k">更新日</span><span class="v">${dateStr}</span>` : ''}
      </div>
      ${notesHtml}
    </div>
    <div class="popup-footer">
      <a class="popup-btn primary" style="background:linear-gradient(135deg,#a855f7,#7c5cbf);" href="https://www.google.com/maps/search/${encodeURIComponent(s.address)}" target="_blank" rel="noopener">Google Maps →</a>
    </div>`;
}

function renderSchoolMarkers(schools) {
  schoolMarkers.forEach(m => map.removeLayer(m));
  schoolMarkers = [];
  if (!layerVisible.ninka) return;
  schools.forEach(s => {
    const m = L.circleMarker([s.lat, s.lng], schoolMarkerStyle(s.vacancies));
    m.bindPopup(buildSchoolPopup(s), { maxWidth: 290 });
    m.on('mouseover', function() { this.openPopup(); });
    m.bindTooltip(`🏫 ${s.name}`, { permanent: false, direction: 'top' });
    m.addTo(map);
    schoolMarkers.push(m);
  });
}

// ── Ninkagai marker helpers ────────────────────────────────────────────────
function ninkagaiMarkerStyle() {
  return {
    radius: 7,
    fillColor: '#22d3ee',
    color: '#0891b2',
    weight: 2,
    opacity: 1,
    fillOpacity: 0.80,
  };
}

function buildNinkagaiPopup(s) {
  return `
    <div class="popup-inner">
      <div class="popup-name" style="color:#22d3ee;">🏢 ${s.name}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">認可外保育施設</div>
      <div class="popup-grid">
        <span class="k">住所</span><span class="v" style="font-size:10px;line-height:1.4">${s.address || '—'}</span>
      </div>
    </div>
    <div class="popup-footer">
      <a class="popup-btn primary" style="background:linear-gradient(135deg,#22d3ee,#0891b2);" href="https://www.google.com/maps/search/${encodeURIComponent(s.address)}" target="_blank" rel="noopener">Google Maps →</a>
    </div>`;
}

function renderNinkagaiMarkers(schools) {
  ninkagaiMarkers.forEach(m => map.removeLayer(m));
  ninkagaiMarkers = [];
  if (!layerVisible.ninkagai) return;
  schools.forEach(s => {
    const m = L.circleMarker([s.lat, s.lng], ninkagaiMarkerStyle());
    m.bindPopup(buildNinkagaiPopup(s), { maxWidth: 270 });
    m.on('mouseover', function() { this.openPopup(); });
    m.bindTooltip(`🏢 ${s.name}`, { permanent: false, direction: 'top' });
    m.addTo(map);
    ninkagaiMarkers.push(m);
  });
}

// ── Layer toggle ───────────────────────────────────────────────────────────
function toggleLayer(layer) {
  layerVisible[layer] = !layerVisible[layer];
  const btn = document.getElementById('layer-' + layer);
  const classMap = { houses: 'on-houses', ninka: 'on-ninka', ninkagai: 'on-ninkagai' };
  if (layerVisible[layer]) {
    btn.classList.add(classMap[layer]);
  } else {
    btn.classList.remove(classMap[layer]);
  }
  if (layer === 'houses') {
    if (!layerVisible.houses && markerClusterGroup) {
      map.removeLayer(markerClusterGroup);
    } else {
      setFilter(filterMode);
    }
  }
  if (layer === 'ninka')  renderSchoolMarkers(allSchools);
  if (layer === 'ninkagai') renderNinkagaiMarkers(allNinkagai);
}

// ── Render property markers (with Spiderfier clustering) ─────────────────
function renderMarkers(listings) {
  // Remove existing cluster group from map
  if (markerClusterGroup) {
    map.removeLayer(markerClusterGroup);
    markerClusterGroup = null;
  }
  allMarkers = [];
  if (!layerVisible.houses) return;

  // Create a fresh cluster group each render
  markerClusterGroup = L.markerClusterGroup({
    // Only spiderfy when markers are at the exact same pixel (not nearby)
    maxClusterRadius: 1,
    // Spiderfy instead of zoom-in when clicking a cluster
    spiderfyOnMaxZoom: true,
    spiderfyDistanceMultiplier: 1.5,
    zoomToBoundsOnClick: false,
    showCoverageOnHover: false,
    // Don't cluster unless markers are truly on top of each other
    disableClusteringAtZoom: 17,
    // Custom cluster icon matching dark theme
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      // Detect if cluster is all-sent, all-unsent, or mixed
      const children = cluster.getAllChildMarkers();
      const allSent = children.every(m => m.options._teleSent);
      const noneSent = children.every(m => !m.options._teleSent);
      const fill   = allSent ? '#34d399' : noneSent ? '#fb923c' : '#fbbf24';
      const border = allSent ? '#059669' : noneSent ? '#c2410c' : '#b45309';
      const size = count > 9 ? 28 : 22;
      return L.divIcon({
        className: '',
        html: `<div style="
          width:${size}px;height:${size}px;border-radius:50%;
          background:${fill};border:2.5px solid ${border};
          display:flex;align-items:center;justify-content:center;
          font-size:11px;font-weight:700;color:#0f1117;
          box-shadow:0 0 8px ${fill}88;
          font-family:'Inter',sans-serif;
          ">${count}</div>`,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2],
      });
    },
  });

  listings.forEach(l => {
    const marker = L.marker([l.lat, l.lng], {
      icon: makeHouseIcon(l),
      // Store tele_sent on options so iconCreateFunction can read it
      _teleSent: l.tele_sent,
    });
    marker.bindPopup(buildPopup(l), { maxWidth: 310 });
    marker.on('mouseover', function() { this.openPopup(); });
    markerClusterGroup.addLayer(marker);
    allMarkers.push(marker);
  });

  map.addLayer(markerClusterGroup);
}

// ── Filter toggle ─────────────────────────────────────────────────────────
function setFilter(mode) {
  filterMode = mode;
  ['all','sent','unsent'].forEach(id => {
    document.getElementById('tog-'+id).classList.toggle('active', id === mode);
  });
  const filtered = allListings.filter(l => {
    if (mode === 'sent') return l.tele_sent;
    if (mode === 'unsent') return !l.tele_sent;
    return true;
  });
  renderMarkers(filtered);
}

// ── Center + radius circle ────────────────────────────────────────────────
function drawCenter(cfg) {
  if (centerMarker) map.removeLayer(centerMarker);
  if (circleLayer) map.removeLayer(circleLayer);

  if (!cfg.location_filter_enabled) return;

  // Center marker
  centerMarker = L.circleMarker([cfg.center_lat, cfg.center_lng], {
    radius: 10, fillColor: '#4f8ef7', color: '#1d4ed8',
    weight: 2.5, opacity: 1, fillOpacity: 0.9,
  }).addTo(map);
  centerMarker.bindTooltip('中心点', { permanent: false });

  // Distance circle
  circleLayer = L.circle([cfg.center_lat, cfg.center_lng], {
    radius: cfg.max_distance_km * 1000,
    color: '#4f8ef7', weight: 1.5,
    fillColor: '#4f8ef7', fillOpacity: 0.05,
    dashArray: '6 4',
  }).addTo(map);
}

// ── Build filter display ──────────────────────────────────────────────────
function buildFilterList(cfg) {
  const rows = [];
  const addRow = (label, val) => {
    if (val !== null && val !== undefined)
      rows.push(`<div class="filter-row"><span class="filter-label">${label}</span><span class="filter-val">${val}</span></div>`);
  };
  if (cfg.location_filter_enabled) {
    addRow('中心点', `${cfg.center_lat}, ${cfg.center_lng}`);
    addRow('半径', `${cfg.max_distance_km} km`);
  }
  addRow('家賃上限', cfg.max_rent_man_yen ? cfg.max_rent_man_yen + '万円' : null);
  addRow('築年数上限', cfg.max_building_age_years ? cfg.max_building_age_years + '年' : null);
  addRow('面積下限', cfg.min_size_m2 ? cfg.min_size_m2 + '㎡' : null);
  addRow('管理費上限', cfg.max_admin_fee_yen ? cfg.max_admin_fee_yen.toLocaleString() + '円' : null);

  if (cfg.allowed_layouts && cfg.allowed_layouts.length > 0) {
    const tags = cfg.allowed_layouts.map(t => `<span class="tag">${t}</span>`).join('');
    rows.push(`<div class="filter-row"><span class="filter-label">間取り</span><span class="filter-val">${tags}</span></div>`);
  }

  document.getElementById('filter-list').innerHTML = rows.join('') || '<div style="font-size:12px;color:var(--text-muted)">フィルターなし</div>';
}

// ── Load data ─────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error-banner').style.display = 'none';

  try {
    // Load property listings
    const res = await fetch('/api/listings');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    allListings = data.listings || [];
    const stats = data.stats || {};
    const cfg = data.config || {};

    // Load school data (ninka)
    const schoolRes = await fetch('/api/schools');
    const schoolData = schoolRes.ok ? await schoolRes.json() : { schools: [], stats: {} };
    allSchools = schoolData.schools || [];

    // Load ninkagai data
    const ninkagaiRes = await fetch('/api/ninkagai');
    const ninkagaiData = ninkagaiRes.ok ? await ninkagaiRes.json() : { schools: [], stats: {} };
    allNinkagai = ninkagaiData.schools || [];

    // Update property stats
    document.getElementById('stat-matched').textContent = stats.matched ?? 0;
    document.getElementById('stat-total').textContent = stats.total_in_db ?? 0;
    const sent = allListings.filter(l => l.tele_sent).length;
    const unsent = allListings.filter(l => !l.tele_sent).length;
    document.getElementById('stat-sent').textContent = sent;
    document.getElementById('stat-unsent').textContent = unsent;
    document.getElementById('panel-subtitle').textContent =
      `${allListings.length}件表示 · DB合計${stats.total_in_db}件`;

    // Update school stats
    document.getElementById('stat-schools').textContent = allSchools.length;
    document.getElementById('stat-schools-total').textContent = schoolData.stats?.total ?? allSchools.length;
    document.getElementById('stat-ninkagai').textContent = allNinkagai.length;
    document.getElementById('stat-ninkagai-total').textContent = ninkagaiData.stats?.total ?? allNinkagai.length;

    // Draw center + circle
    drawCenter(cfg);

    // Build filter display
    buildFilterList(cfg);

    // Set map view
    if (cfg.center_lat && cfg.center_lng) {
      map.setView([cfg.center_lat, cfg.center_lng], 14);
    } else if (allListings.length > 0) {
      map.setView([allListings[0].lat, allListings[0].lng], 14);
    } else {
      map.setView([34.724, 135.474], 13);
    }

    // Render markers
    setFilter(filterMode);
    renderSchoolMarkers(allSchools);
    renderNinkagaiMarkers(allNinkagai);

    // Fit bounds to include listings, ninka, and ninkagai
    const allPts = [
      ...allListings.map(l => [l.lat, l.lng]),
      ...allSchools.map(s => [s.lat, s.lng]),
      ...allNinkagai.map(s => [s.lat, s.lng]),
    ];
    if (cfg.center_lat) allPts.push([cfg.center_lat, cfg.center_lng]);
    if (allPts.length > 0) {
      map.fitBounds(L.latLngBounds(allPts).pad(0.1));
    }

  } catch (err) {
    console.error(err);
    const banner = document.getElementById('error-banner');
    banner.textContent = '⚠️ ' + err.message;
    banner.style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
loadData();
</script>

</html>
